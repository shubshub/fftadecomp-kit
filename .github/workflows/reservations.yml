name: reservations

on:
  issue_comment:
    types: [created]
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: quiet days before a reservation is released
        required: false
        default: "3"

permissions:
  issues: write
  contents: write
  pull-requests: read

jobs:
  broker:
    name: process reservation requests
    if: >-
      github.repository == 'shubshub/fftadecomp-kit' &&
      (github.event_name != 'issue_comment' ||
       (github.event.issue.state == 'open' && !github.event.issue.pull_request &&
        startsWith(github.event.comment.body, '<!-- ffta-reservation-request:v1 -->')))
    concurrency:
      group: ffta-address-ledger-50
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      FFTA_KIT_REPO: shubshub/fftadecomp-kit
      FFTA_REPO: shubshub/fftadecomp
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: archive closed receipts, drain requests, and expire stale leases
        run: python tools/reserve.py --no-pull broker --archive-closed
